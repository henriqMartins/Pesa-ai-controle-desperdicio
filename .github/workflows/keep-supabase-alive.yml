name: Keep Supabase Alive

# Mantém o projeto Supabase ativo evitando a pausa automática após 7 dias de inatividade.
# Faz uma query leve na REST API (toca o Postgres) a cada 2 dias.
#
# Usa a SERVICE_ROLE key: após a Fase 2 (RLS por papel), a anon key recebe 401 e
# o ping falharia. A service_role ignora o RLS e é segura aqui (roda no GitHub
# Actions, nunca no frontend). Ver docs/plano-seguranca.md.

on:
  schedule:
    # A cada 2 dias às 09:00 UTC. Folga de segurança contra atrasos/pulos do cron.
    - cron: '0 9 */2 * *'
  workflow_dispatch: # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # Diagnóstico: confirma que os secrets chegaram preenchidos
          # (mostra só o tamanho, nunca o valor).
          echo "URL definida? len=${#SUPABASE_URL}"
          echo "SERVICE_ROLE_KEY definida? len=${#SUPABASE_SERVICE_ROLE_KEY}"

          body=$(curl -s -w "\n%{http_code}" \
            "${SUPABASE_URL}/rest/v1/funcionarios?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          status=$(echo "$body" | tail -n1)
          echo "HTTP status: $status"
          echo "Resposta: $(echo "$body" | sed '$d')"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Ping falhou com status $status"
            exit 1
          fi
          echo "Supabase respondeu OK — projeto mantido ativo."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
